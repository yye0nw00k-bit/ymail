<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ymail — Yeole Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F4; --panel:#FFFFFF; --ink:#12262D; --mute:#5E7379; --line:#DCE5E7;
  --teal:#0F6E7E; --teal-ink:#FFFFFF; --tint:#E0F0F2; --amber:#E8912D; --danger:#B93A0B;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C171B;--panel:#132227;--ink:#E4EEF0;--mute:#8CA3A9;--line:#223339;--teal:#3FB6C7;--teal-ink:#06181C;--tint:#173238;--amber:#F2A954;--danger:#F0865A}
}
:root[data-theme="dark"]{--bg:#0C171B;--panel:#132227;--ink:#E4EEF0;--mute:#8CA3A9;--line:#223339;--teal:#3FB6C7;--teal-ink:#06181C;--tint:#173238;--amber:#F2A954;--danger:#F0865A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg{display:block}

#app{height:100%;display:grid;grid-template-rows:56px 1fr;grid-template-columns:76px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;min-width:150px}
.brand small{font-weight:500;color:var(--mute);font-size:12px}
.search{flex:1;max-width:640px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:0 16px;height:38px}
.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}
.search:focus-within{box-shadow:0 0 0 2px var(--teal)}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:600;font-size:13px}

nav.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-right:1px solid var(--line);background:var(--panel)}
.rail button{width:56px;padding:8px 0 6px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);position:relative}
.rail button:hover{background:var(--bg)}
.rail button[aria-current="page"]{background:var(--tint);color:var(--teal);font-weight:600}
.badge{position:absolute;top:2px;right:6px;background:var(--amber);color:#1a1207;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

main{min-height:0;min-width:0;position:relative}
.view{height:100%;display:none}
.view.on{display:block}

/* mail */
.mail{height:100%;display:grid;grid-template-columns:208px 360px 1fr}
.folders{padding:12px 8px;border-right:1px solid var(--line);overflow:auto}
.compose-btn{width:100%;background:var(--teal);color:var(--teal-ink);border-radius:16px;height:48px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.compose-btn:hover{filter:brightness(1.08)}
.folder{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:999px;color:var(--ink);text-align:left}
.folder:hover{background:var(--panel)}
.folder[aria-current="true"]{background:var(--tint);color:var(--teal);font-weight:600}
.folder span:last-child{font-size:12px;color:var(--mute)}
.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.list-head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between}
.list-head span{font-weight:400;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.row:hover{background:var(--bg)}
.row[aria-current="true"]{background:var(--tint)}
.row .from{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .from,.row.unread .subj{font-weight:700}
.row .time{font-size:12px;color:var(--mute)}
.row .subj{grid-column:1/2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .snip{grid-column:1/2;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .star{grid-column:2/3;grid-row:2/4;align-self:center;color:var(--mute);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.row .star.on{color:var(--amber)}
.reader{overflow:auto;padding:0}
.reader-inner{max-width:760px;padding:24px 32px 48px}
.reader h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;line-height:1.3}
.meta{color:var(--mute);font-size:13px;margin-bottom:20px}
.body{white-space:pre-wrap;font-size:15px;line-height:1.75;max-width:66ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal);font-weight:600}
.empty{height:100%;display:grid;place-items:center;color:var(--mute);text-align:center;padding:24px}
.back{display:none}

/* compose */
.compose{position:fixed;right:24px;bottom:0;width:520px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 8px 32px rgba(8,30,36,.22);display:none;flex-direction:column;z-index:20;margin-bottom:env(safe-area-inset-bottom,0px)}
.compose.on{display:flex}
.compose .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:var(--panel);border-radius:14px 14px 0 0;font-weight:600}
.compose .top button{color:inherit}
.compose input.f,.compose textarea{border:0;border-bottom:1px solid var(--line);padding:10px 14px;background:transparent;outline:0;width:100%}
.compose textarea{height:260px;resize:none;border-bottom:0;line-height:1.7}
.compose .foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.compose .foot .sp{flex:1}

/* chat */
.chat{height:100%;display:grid;grid-template-columns:280px 1fr}
.contacts{border-right:1px solid var(--line);background:var(--panel);overflow:auto}
.contact{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.contact:hover{background:var(--bg)}
.contact[aria-current="true"]{background:var(--tint)}
.contact .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.contact .nm{font-weight:600}
.contact .last{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.thread{display:flex;flex-direction:column;min-height:0}
.thread-head{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);font-weight:600;display:flex;align-items:center;gap:8px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:min(70%,460px);padding:8px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
.composer input{flex:1;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 16px;outline:0;min-width:0}
.composer input:focus{border-color:var(--teal)}

/* browser */
.browser{height:100%;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--bg);overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px 10px 0 0;max-width:200px;min-width:110px;color:var(--mute);background:transparent;flex:none}
.tab[aria-current="true"]{background:var(--panel);color:var(--ink)}
.tab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.tab .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}
.tab .x:hover{background:var(--line)}
.addr{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.addr form{flex:1;display:flex}
.addr input{flex:1;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 16px;outline:0}
.addr input:focus{border-color:var(--teal)}
.page{flex:1;overflow:auto;padding:32px 24px;background:var(--panel)}
.page-in{max-width:720px;margin:0 auto}
.page h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:24px}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;background:var(--bg)}
.tile:hover{border-color:var(--teal)}
.tile b{display:block;margin-top:6px;font-weight:600}
.res{padding:14px 0;border-bottom:1px solid var(--line)}
.res .u{font-size:12px;color:var(--mute)}
.res .h{color:var(--teal);font-size:17px;font-weight:600}
.note{background:var(--tint);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:13px}



/* yeole dictionary */
.dictionary{height:100%;overflow:auto;padding:clamp(18px,4vw,40px);background:var(--panel)}
.dictionary-in{max-width:920px;margin:0 auto}
.dictionary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.dictionary-head h1{font-size:clamp(25px,4vw,34px);letter-spacing:-.04em;margin:0}
.dict-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dictionary-head p{color:var(--mute);margin:5px 0 0}
.dict-search{display:flex;gap:8px;margin:18px 0 22px}
.dict-filters{display:flex;gap:7px;flex-wrap:wrap;margin:-7px 0 8px}
.dict-filter{border:1px solid var(--line);background:transparent;color:var(--mute);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12px}
.dict-filter.active{background:var(--tint);border-color:var(--teal);color:var(--teal);font-weight:700}
.dict-source-note{font-size:12px;color:var(--mute);margin:0 0 14px;min-height:16px}
.dict-more-wrap{display:flex;justify-content:center;padding:18px 0}
.dict-more{width:100%;justify-content:center}
.dict-form :disabled{opacity:.55;cursor:not-allowed}
.dict-search input,.dict-form input,.dict-form textarea,.dict-form select{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:11px 13px;outline:0}
.dict-search input:focus,.dict-form input:focus,.dict-form textarea:focus,.dict-form select:focus{border-color:var(--teal)}
.dict-search input{border-radius:999px;padding:0 18px;height:44px}
.dict-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
.dict-results{min-width:0}
.dict-entry{padding:18px 0;border-bottom:1px solid var(--line)}
.dict-word{font-size:23px;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}
.dict-kind{display:inline-flex;vertical-align:middle;margin-left:8px;font-size:11px;border-radius:999px;padding:3px 9px;font-weight:600}
.dict-kind.official{background:var(--tint);color:var(--teal)}
.dict-kind.open{background:#FFF0D9;color:#83500E}
.dict-meta{color:var(--mute);font-size:12px;margin:4px 0 9px}
.dict-no-definition{color:var(--mute);font-style:italic}
.dict-definition{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.dict-example{color:var(--mute);margin-top:8px;font-size:13px;white-space:pre-wrap}
.dict-entry-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dict-form{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:0}
.dict-form h2{font-size:17px;margin:0 0 5px}
.dict-form p{color:var(--mute);font-size:12px;margin:0 0 14px}
.dict-form label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
.dict-form textarea{resize:vertical;min-height:92px}
.dict-empty{padding:32px 8px;color:var(--mute);text-align:center}
@media(max-width:820px){.dict-layout{grid-template-columns:1fr}.dict-form{position:static;grid-row:1}.dictionary{padding:20px 16px}}

#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;place-items:center;padding:20px;overflow:auto}
#auth.on{display:grid}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
.auth-card .brand{margin-bottom:20px}
.auth-card h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.auth-card p.sub{margin:0 0 20px;color:var(--mute)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;margin-bottom:20px}
.seg button{flex:1;height:34px;border-radius:999px;color:var(--mute)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(8,30,36,.15)}
.field{display:block;margin-bottom:14px}
.field span.l{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:0}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--tint)}
.idrow{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding-right:12px}
.idrow:focus-within{border-color:var(--teal);box-shadow:0 0 0 2px var(--tint)}
.idrow input{border:0;background:transparent;box-shadow:none!important;flex:1;min-width:0}
.idrow em{font-style:normal;color:var(--mute)}
.err{color:var(--danger);font-size:13px;min-height:20px;margin:0 0 10px}
.auth-card .btn.primary{width:100%;height:44px;justify-content:center}
.umenu{position:fixed;top:52px;right:12px;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(8,30,36,.2);padding:14px;z-index:40;display:none}
.umenu.on{display:block}
.umenu .n{font-weight:600}.umenu .e{color:var(--mute);font-size:13px;margin-bottom:12px;overflow-wrap:anywhere}
.umenu .btn{width:100%;justify-content:center;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(6,20,24,.5);z-index:60;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--panel);border-radius:16px;width:100%;max-width:720px;max-height:85vh;overflow:auto;padding:20px 24px}
.modal h2{margin:0 0 12px;font-size:20px}
.utable{width:100%;border-collapse:collapse}
.utable th,.utable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
.utable th{color:var(--mute);font-weight:500}
.tag{font-size:11px;background:var(--tint);color:var(--teal);border-radius:999px;padding:1px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}

@media (max-width:1000px){
  .mail{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .folders{display:flex;gap:6px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .compose-btn{width:auto;flex:none;padding:0 16px;height:36px;margin:0;border-radius:999px}
  .folder{width:auto;flex:none;padding:6px 12px;gap:6px}
  .list{border-right:0}
  .reader{position:absolute;inset:0;background:var(--bg);display:none;z-index:5;top:auto}
  .mail.reading .reader{display:block;top:0}
  .back{display:inline-flex;margin:12px 0 0 12px}
  .reader-inner{padding:12px 20px 40px}
  .chat{grid-template-columns:1fr}
  .chat.open .contacts{display:none}
  .chat:not(.open) .thread{display:none}
}
@media (max-width:720px){
  #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 60px}
  header{grid-column:1}
  .brand small,.brand-name-full{display:none}
  .brand{min-width:0}
  nav.rail{grid-row:3;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 0}
  .compose{right:0;width:100%;border-radius:0;top:0;border:0}
  .compose .top{border-radius:0}
  .compose textarea{flex:1;height:auto}
  .hdr-actions .theme{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--teal)"/>
        <path d="M6 12c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M6 18c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
        <path d="M6 24c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round" opacity=".4"/>
      </svg>
      <span>Ymail <small class="brand-name-full">Yeole Mail</small></span>
    </div>
    <label class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="메일 검색" aria-label="메일 검색" autocomplete="off">
    </label>
    <div class="hdr-actions">
      <button class="icon-btn theme" id="themeBtn" title="테마 전환" aria-label="테마 전환">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" aria-label="계정 메뉴" aria-haspopup="true">나</button>
    </div>
  </header>

  <nav class="rail" aria-label="앱">
    <button data-view="mail" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>메일<i class="badge" id="mailBadge">0</i></button>
    <button data-view="chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>채팅</button>
    <button data-view="browser"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>브라우저</button>
    <button data-view="dictionary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 017.5 2H20v18H7.5A2.5 2.5 0 015 17.5z"/><path d="M5 4.5v13M9 6h7M9 10h7"/></svg>국어사전</button>
  </nav>

  <main>
    <!-- MAIL -->
    <section class="view on" id="v-mail">
      <div class="mail" id="mailGrid">
        <aside class="folders" id="folders"></aside>
        <div class="list" id="list"></div>
        <article class="reader" id="reader"></article>
      </div>
    </section>

    <!-- CHAT -->
    <section class="view" id="v-chat">
      <div class="chat" id="chatGrid">
        <div class="contacts" id="contacts"></div>
        <div class="thread">
          <div class="thread-head"><button class="btn back" id="chatBack" style="margin:0">← 목록</button><span id="threadName"></span></div>
          <div class="msgs" id="chatMsgs"></div>
          <form class="composer" id="chatForm"><input id="chatIn" placeholder="메시지 입력" aria-label="메시지 입력" autocomplete="off"><button class="btn primary">보내기</button></form>
        </div>
      </div>
    </section>

    <!-- YE OLE DICTIONARY -->
    <section class="view" id="v-dictionary">
      <div class="dictionary"><div class="dictionary-in">
        <div class="dictionary-head"><div><h1>yeole 국어사전</h1><p>함께 뜻을 모으는 우리말 사전</p></div><div class="dict-head-actions"><span class="tag">Ymail 계정 연동</span><button class="btn" id="dictImportRetry" type="button" style="display:none">끝말왕 단어장 다시 동기화</button></div></div>
        <form class="dict-search" id="dictSearch"><input id="dictQuery" type="search" placeholder="단어, 뜻, 품사 검색" aria-label="국어사전 검색"><button class="btn primary">검색</button></form>
        <div class="dict-filters" role="group" aria-label="사전 항목 종류">
          <button class="dict-filter active" type="button" data-dict-type="all">전체</button>
          <button class="dict-filter" type="button" data-dict-type="official">공식 사전</button>
          <button class="dict-filter" type="button" data-dict-type="open">오픈사전</button>
        </div>
        <p class="dict-source-note" id="dictSourceNote" aria-live="polite">끝말왕 단어장을 준비하고 있어요.</p>
        <div class="dict-layout"><div class="dict-results" id="dictResults"><div class="dict-empty">사전을 불러오는 중…</div></div>
          <form class="dict-form" id="dictForm"><h2>단어 등록</h2><p id="dictFormNote">일반 계정이 등록한 항목은 비공식 오픈사전으로 표시됩니다.</p>
            <label for="dictWord">단어 *</label><input id="dictWord" maxlength="60" required placeholder="예: 끝말왕">
            <label for="dictPos">품사</label><select id="dictPos"><option value="">선택 안 함</option><option>명사</option><option>대명사</option><option>수사</option><option>동사</option><option>형용사</option><option>관형사</option><option>부사</option><option>감탄사</option><option>조사</option><option>기타</option></select>
            <label for="dictDefinition">뜻 *</label><textarea id="dictDefinition" maxlength="1200" required placeholder="단어의 뜻을 설명해 주세요."></textarea>
            <label for="dictExample">예문</label><textarea id="dictExample" maxlength="500" placeholder="이 단어를 사용한 문장 (선택)"></textarea>
            <button class="btn primary" id="dictSubmit" style="width:100%;justify-content:center;margin-top:14px">단어 등록</button>
          </form>
        </div>
      </div></div>
    </section>

    <!-- BROWSER -->
    <section class="view" id="v-browser">
      <div class="browser">
        <div class="tabs" id="tabs"></div>
        <div class="addr">
          <button class="icon-btn" id="homeBtn" title="시작 페이지" aria-label="시작 페이지"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg></button>
          <form id="addrForm"><input id="addrIn" placeholder="검색어 또는 주소 입력" aria-label="주소창" autocomplete="off"></form>

    </section>
  </main>
</div>

<!-- compose -->
<div class="compose" id="compose" role="dialog" aria-label="새 메일">
  <div class="top"><span>새 메일</span><button id="cClose" aria-label="닫기">✕</button></div>
  <input class="f" id="cTo" placeholder="받는 사람" aria-label="받는 사람">
  <input class="f" id="cSub" placeholder="제목" aria-label="제목">
  <textarea id="cBody" placeholder="내용을 입력하세요" aria-label="내용"></textarea>
  <div class="foot">
    <button class="btn primary" id="cSend">보내기</button>
    <span class="sp"></span>
    <button class="btn" id="cDiscard">버리기</button>
  </div>
</div>
<div class="umenu" id="umenu" role="menu">
  <div class="n" id="umName"></div><div class="e" id="umEmail"></div>
  <button class="btn" id="umAdmin" style="display:none">관리자 패널</button>
  <button class="btn" id="umLogout">로그아웃</button>
</div>

  <div style="display:flex;justify-content:space-between;align-items:center"><h2>사용자 관리</h2><button class="icon-btn" id="adminClose" aria-label="닫기">✕</button></div>
  <div id="adminBody">불러오는 중…</div>
</div></div>
<div id="auth" class="on"><form class="auth-card" id="authForm" novalidate>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--teal)"/><path d="M6 12c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round"/><path d="M6 18c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><path d="M6 24c3-3 5-3 8 0s5 3 8 0 3-2 4-1.5" fill="none" stroke="var(--teal-ink)" stroke-width="2.2" stroke-linecap="round" opacity=".4"/></svg>
    <span>Ymail <small>Yeole Mail</small></span>
  </div>
  <div class="seg" role="tablist"><button type="button" role="tab" id="tabLogin" aria-selected="true" onclick="setAuthMode('login')">로그인</button><button type="button" role="tab" id="tabSignup" aria-selected="false" onclick="setAuthMode('signup')">회원가입</button></div>
  <label class="field" id="fName" style="display:none"><span class="l">이름</span><input id="aName" autocomplete="name" maxlength="40"></label>
  <label class="field"><span class="l">아이디</span><div class="idrow"><input id="aUser" autocomplete="username" autocapitalize="none" spellcheck="false"><em>@ymail.com</em></div></label>
  <label class="field"><span class="l">비밀번호</span><input id="aPass" type="password" autocomplete="current-password"></label>
  <label class="field" id="fPass2" style="display:none"><span class="l">비밀번호 확인</span><input id="aPass2" type="password" autocomplete="new-password"></label>
  <p class="err" id="authErr" role="alert"></p>
  <button class="btn primary" id="authSubmit">로그인</button>
</form></div>
<div id="toast" role="status"></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
let ME='', USER=null;
const K=n=>'ymail:'+ME+':'+n;

/* ---------- state ---------- */
let mails=[];
async function loadMails(){
  try{
    const r=await api('/api/mail');
    mails=(r.mails||[]);
    renderMail();
  }catch(e){toast(e.message)}
}
function save(){/* 서버 저장 방식: 보낼 때 API가 저장합니다. */}

let folder='inbox', sel=null, query='';
const folderDefs=[['inbox','받은편지함'],['starred','별표편지함'],['sent','보낸편지함'],['drafts','임시보관함'],['trash','휴지통']];
const inFolder=(m,f)=>f==='starred'?(m.star&&m.folder!=='trash'):m.folder===f;

/* ---------- view switching ---------- */
function show(v){
  $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  $$('.rail button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===v)||b.removeAttribute('aria-current'));
  $$('.rail button').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page')});
  $('#searchBox').style.visibility=v==='mail'?'visible':'hidden';
}
$('.rail button').forEach(b=>b.onclick=()=>{show(b.dataset.view);if(b.dataset.view==='dictionary')loadDictionary()});

/* ---------- mail ---------- */
function renderFolders(){
  $('#folders').innerHTML=`<button class="compose-btn" id="newMail"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>편지 쓰기</button>`+
   folderDefs.map(([k,n])=>{
     const c=k==='inbox'?mails.filter(m=>m.folder==='inbox'&&!m.read).length:(k==='drafts'?mails.filter(m=>m.folder==='drafts').length:'');
     return `<button class="folder" data-f="${k}" aria-current="${k===folder}"><span>${n}</span><span>${c||''}</span></button>`}).join('');
  $('#newMail').onclick=()=>openCompose();
  $$('#folders .folder').forEach(b=>b.onclick=()=>{folder=b.dataset.f;sel=null;$('#mailGrid').classList.remove('reading');renderMail()});
  const u=mails.filter(m=>m.folder==='inbox'&&!m.read).length;
  const bd=$('#mailBadge');bd.textContent=u;bd.style.display=u?'grid':'none';
}
function renderList(){
  const items=mails.filter(m=>inFolder(m,folder)&&(!query||(m.subj+m.from+m.body).toLowerCase().includes(query)));
  const name=folderDefs.find(f=>f[0]===folder)[1];
  $('#list').innerHTML=`<div class="list-head">${name}<span>${items.length}개</span></div>`+
   (items.length?items.map(m=>`<div class="row ${m.read?'':'unread'}" role="button" tabindex="0" data-id="${m.id}" aria-current="${m.id===sel}">
     <span class="from">${esc(m.folder==='sent'?'받는사람: '+(m.to||''):m.from)}</span><span class="time">${esc(m.time)}</span>
     <span class="subj">${esc(m.subj||'(제목 없음)')}</span>
     <button class="star ${m.star?'on':''}" data-star="${m.id}" aria-label="별표">${m.star?'★':'☆'}</button>
     <span class="snip">${esc(m.body.replace(/\n+/g,' ').slice(0,80))}</span></div>`).join('')
   :`<div class="empty">${query?'검색 결과가 없어요.':'이 폴더에는 메일이 없어요.'}</div>`);
  $$('#list .row').forEach(r=>{
    const open=()=>{sel=+r.dataset.id;const m=mails.find(x=>x.id===sel);if(m.folder==='drafts'){openCompose(m);return}
      m.read=true;api('/api/mail/read',{method:'POST',body:{id:m.id}}).catch(()=>{});$('#mailGrid').classList.add('reading');renderMail()};
    r.onclick=e=>{if(e.target.closest('[data-star]'))return;open()};
    r.onkeydown=e=>{if(e.key==='Enter')open()};
  });
  $$('#list [data-star]').forEach(b=>b.onclick=()=>{const m=mails.find(x=>x.id==+b.dataset.star);m.star=!m.star;save();renderMail()});
}
function renderReader(){
  const m=mails.find(x=>x.id===sel);
  if(!m){$('#reader').innerHTML='<div class="empty">메일을 선택하면 여기에 내용이 표시돼요.</div>';return}
  $('#reader').innerHTML=`<button class="btn back" id="backBtn">← 목록</button><div class="reader-inner">
   <h2>${esc(m.subj||'(제목 없음)')}</h2>
   <div class="meta">${esc(m.from)} &lt;${esc(m.addr)}&gt; · ${esc(m.time)}</div>
   <div class="actions">
     <button class="btn primary" id="rReply">답장</button>
     <button class="btn" id="rStar">${m.star?'별표 해제':'별표'}</button>
     <button class="btn" id="rDel">${m.folder==='trash'?'완전 삭제':'삭제'}</button>
   </div>
   <div class="body">${esc(m.body)}</div></div>`;
  $('#backBtn').onclick=()=>{$('#mailGrid').classList.remove('reading')};
  $('#rReply').onclick=()=>openCompose({to:m.addr,subj:'Re: '+m.subj.replace(/^Re:\s*/,''),body:'\n\n\n--- '+m.from+' 님의 메시지 ---\n'+m.body.split('\n').map(l=>'> '+l).join('\n')});
  $('#rStar').onclick=async()=>{m.star=!m.star;try{await api('/api/mail/star',{method:'POST',body:{id:m.id,star:m.star}});await loadMails()}catch(e){toast(e.message)}};
  $('#rDel').onclick=async()=>{try{await api('/api/mail/move-trash',{method:'POST',body:{id:m.id}});sel=null;$('#mailGrid').classList.remove('reading');await loadMails();toast('삭제했어요')}catch(e){toast(e.message)}};
}
function renderMail(){renderFolders();renderList();renderReader()}
$('#q').oninput=e=>{query=e.target.value.trim().toLowerCase();sel=null;renderList();renderReader()};

/* compose */
let draftId=null;
function openCompose(d={}){
  draftId=d.id||null;
  $('#cTo').value=d.to||'';$('#cSub').value=d.subj||'';$('#cBody').value=d.body||'';
  $('#compose').classList.add('on');
  ($('#cTo').value?$('#cBody'):$('#cTo')).focus();
}
function closeCompose(saveDraft){
  const to=$('#cTo').value.trim(),subj=$('#cSub').value.trim(),body=$('#cBody').value;
  if(saveDraft&&(to||subj||body.trim())){
    const ex=draftId&&mails.find(m=>m.id===draftId);
    if(ex)Object.assign(ex,{to,subj,body});
    else mails.push({id:Date.now(),from:'나',addr:ME,to,subj,body,time:'방금',read:true,star:false,folder:'drafts'});
    save();toast('임시보관함에 저장했어요');
  }else if(draftId){mails=mails.filter(m=>m.id!==draftId);save()}
  $('#compose').classList.remove('on');draftId=null;renderMail();
}
$('#cClose').onclick=()=>closeCompose(true);
$('#cDiscard').onclick=()=>{$('#compose').classList.remove('on');if(draftId){mails=mails.filter(m=>m.id!==draftId);save()}draftId=null;renderMail()};
$('#cSend').onclick=async()=>{
  const to=$('#cTo').value.trim(),subj=$('#cSub').value.trim(),body=$('#cBody').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(to)){toast('받는 사람 주소를 올바르게 입력하세요');$('#cTo').focus();return}
  if(!body){toast('내용을 입력하세요');$('#cBody').focus();return}
  const btn=$('#cSend');btn.disabled=true;
  try{
    await api('/api/mail/send',{method:'POST',body:{to,subj,body}});
    $('#compose').classList.remove('on');draftId=null;folder='sent';sel=null;await loadMails();toast('메일을 보냈어요');
  }catch(e){toast(e.message)}finally{btn.disabled=false}
};
/* ---------- chat ---------- */
let people=[];
let chatSel='';
let chatMessages=[];
async function loadChatPeople(){
  try{
    const r=await api('/api/chat/people');
    people=r.users||[];
    if(!chatSel && people.length) chatSel=people[0].username;
    await loadChatMessages();
  }catch(e){toast(e.message)}
}
async function loadChatMessages(){
  if(!chatSel){renderChat();return}
  try{
    const r=await api('/api/chat?with='+encodeURIComponent(chatSel));
    chatMessages=r.messages||[];
    renderChat();
  }catch(e){toast(e.message)}
}
function renderChat(){
  $('#contacts').innerHTML=people.length?people.map(p=>`<button class="contact" data-id="${esc(p.username)}" aria-current="${p.username===chatSel}"><span class="av">${esc(p.name?.[0]||p.username[0])}</span><span><span class="nm">${esc(p.name||p.username)}</span><br><span class="last">${esc(p.email)}</span></span></button>`).join(''):`<div class="empty">아직 다른 Ymail 사용자가 없어요.</div>`;
  $$('#contacts .contact').forEach(b=>b.onclick=async()=>{chatSel=b.dataset.id;$('#chatGrid').classList.add('open');await loadChatMessages()});
  const p=people.find(x=>x.username===chatSel);
  $('#threadName').textContent=p?(p.name||p.username):'대화 상대 없음';
  $('#chatMsgs').innerHTML=chatMessages.length?chatMessages.map(m=>`<div class="bubble ${m.from===USER.username?'me':''}">${esc(m.body)}<div style="font-size:10px;opacity:.55;margin-top:4px">${new Date(m.createdAt).toLocaleString('ko-KR')}</div></div>`).join(''):`<div class="empty">메시지를 보내 대화를 시작해 보세요.</div>`;
  const el=$('#chatMsgs');el.scrollTop=el.scrollHeight;
}
$('#chatBack').onclick=()=>$('#chatGrid').classList.remove('open');
$('#chatForm').onsubmit=async e=>{
  e.preventDefault();const v=$('#chatIn').value.trim();if(!v||!chatSel)return;
  try{await api('/api/chat',{method:'POST',body:{to:chatSel,body:v}});$('#chatIn').value='';await loadChatMessages();}catch(x){toast(x.message)}
};
let chatPoll=null;
function startChatPoll(){clearInterval(chatPoll);chatPoll=setInterval(()=>{if(USER&&$('#v-chat').classList.contains('on')&&chatSel)loadChatMessages()},2500)}

/* ---------- yeole 국어사전 ---------- */
let dictionaryEntries=[];
let dictionaryQuery='';
let dictionaryType='all';
let dictionaryPage=0;
let dictionaryHasMore=false;
let dictionaryTotal=0;
let dictionaryLoading=false;
async function loadDictionary(options={}){
  const append=!!options.append;
  if(dictionaryLoading)return;
  dictionaryLoading=true;
  const box=$('#dictResults');
  if(!append)box.innerHTML='<div class="dict-empty">사전을 불러오는 중…</div>';
  try{
    const page=append?dictionaryPage+1:0;
    const params=new URLSearchParams({q:dictionaryQuery,type:dictionaryType,page:String(page),limit:'40'});
    const r=await api('/api/dictionary?'+params.toString());
    dictionaryPage=r.page||0;
    dictionaryHasMore=!!r.hasMore;
    dictionaryTotal=Number(r.total||0);
    dictionaryEntries=append?dictionaryEntries.concat(r.entries||[]):(r.entries||[]);
    renderDictionary();
    refreshDictionaryStatus();
  }catch(e){
    if(!append)box.innerHTML='<div class="dict-empty">'+esc(e.message)+'</div>';
    else toast(e.message);
  }finally{dictionaryLoading=false}
}
async function refreshDictionaryStatus(){
  const note=$('#dictSourceNote');
  try{
    const s=await api('/api/dictionary/status');
    if(s.status==='가져오는 중')note.textContent='끝말왕 확장 단어장을 가져오는 중이에요. 기본 단어는 먼저 검색할 수 있어요.';
    else if(s.status==='완료')note.textContent='끝말왕 단어장 연결 완료 · 현재 검색 결과 '+dictionaryTotal.toLocaleString('ko-KR')+'개';
    else if(s.status==='일부 목록 사용 불가')note.textContent='일부 외부 단어장은 연결되지 않았어요. 내장 단어와 이미 가져온 단어는 정상 이용할 수 있어요.';
    else note.textContent='현재 검색 결과 '+dictionaryTotal.toLocaleString('ko-KR')+'개';
  }catch(e){note.textContent='현재 검색 결과 '+dictionaryTotal.toLocaleString('ko-KR')+'개'}
}
function renderDictionary(){
  const box=$('#dictResults');
  const note=$('#dictFormNote');
  const controls=$$('#dictForm input, #dictForm textarea, #dictForm select, #dictSubmit');
  if(!USER){
    note.textContent='단어 등록은 Ymail 로그인 후 이용할 수 있어요. 검색은 로그인 없이 가능합니다.';
    controls.forEach(control=>control.disabled=true);
  }else{
    controls.forEach(control=>control.disabled=false);
    note.textContent=USER.role==='admin'
      ?'관리자 계정으로 등록하면 공식 단어가 됩니다. 오픈사전 항목도 공식 단어로 승격할 수 있어요.'
      :'일반 계정이 등록한 항목은 비공식 오픈사전으로 표시됩니다.';
  }
  $('.dict-filter').forEach(button=>button.classList.toggle('active',button.dataset.dictType===dictionaryType));
  $('#dictImportRetry').style.display=USER&&USER.role==='admin'?'':'none';
  if(!dictionaryEntries.length){
    box.innerHTML='<div class="dict-empty">검색 결과가 없어요. '+(USER?'첫 번째 단어를 등록해 보세요.':'로그인 후 첫 번째 단어를 등록할 수 있어요.')+'</div>';
    return;
  }
  box.innerHTML=dictionaryEntries.map(entry=>{
    const official=entry.type==='official';
    const canDelete=USER&&(USER.role==='admin'||entry.author===USER.username);
    const source=entry.source?(' · '+esc(entry.source)):'';
    return '<article class="dict-entry"><div class="dict-word">'+esc(entry.word)+'<span class="dict-kind '+(official?'official':'open')+'">'+(official?'공식 단어':'비공식 오픈사전')+'</span></div>'+
      '<div class="dict-meta">'+(entry.pos?esc(entry.pos)+' · ':'')+'작성자 '+esc(entry.authorName||entry.author||'알 수 없음')+source+(entry.createdAt?' · '+esc(String(entry.createdAt).slice(0,10)):'')+'</div>'+
      (entry.definition?'<div class="dict-definition">'+esc(entry.definition)+'</div>':'<div class="dict-definition dict-no-definition">뜻이 아직 등록되지 않았어요.</div>')+
      (entry.example?'<div class="dict-example">예문 · '+esc(entry.example)+'</div>':'')+
      (canDelete||(USER&&USER.role==='admin'&&!official)?'<div class="dict-entry-actions">'+(USER&&USER.role==='admin'&&!official?'<button class="btn" data-promote="'+esc(entry.id)+'">공식 단어로 승격</button>':'')+(canDelete?'<button class="btn" data-dict-delete="'+esc(entry.id)+'">삭제</button>':'')+'</div>':'')+
      '</article>';
  }).join('')+(dictionaryHasMore?'<div class="dict-more-wrap"><button class="btn dict-more" type="button" data-dict-more>더 많은 단어 보기</button></div>':'');
  $('[data-dict-delete]',box).forEach(btn=>btn.onclick=async()=>{
    if(!confirm('이 사전 항목을 삭제할까요?'))return;
    try{await api('/api/dictionary/'+encodeURIComponent(btn.dataset.dictDelete),{method:'DELETE'});toast('항목을 삭제했어요');await loadDictionary()}catch(e){toast(e.message)}
  });
  $('[data-promote]',box).forEach(btn=>btn.onclick=async()=>{
    try{await api('/api/admin/dictionary/'+encodeURIComponent(btn.dataset.promote)+'/official',{method:'POST',body:{}});toast('공식 단어로 승격했어요');await loadDictionary()}catch(e){toast(e.message)}
  });
  const more=$('[data-dict-more]',box);
  if(more)more.onclick=()=>loadDictionary({append:true});
}

/* ---------- browser ---------- */
/* ---------- browser ---------- */
let tabs=[{id:1,url:'ymail://start',title:'시작 페이지'}],tabSel=1,tabSeq=1;
const isUrl=s=>/^(https?:\/\/|www\.)/i.test(s)||/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s);
function renderTabs(){
  $('#tabs').innerHTML=tabs.map(t=>`<div class="tab" role="button" tabindex="0" data-id="${t.id}" aria-current="${t.id===tabSel}"><span class="t">${esc(t.title)}</span>${tabs.length>1?`<button class="x" data-x="${t.id}" aria-label="탭 닫기">×</button>`:''}</div>`).join('')+
   `<button class="icon-btn" id="newTab" aria-label="새 탭" style="align-self:center">＋</button>`;
  $$('#tabs .tab').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-x]'))return;tabSel=+el.dataset.id;renderBrowser()}});
  $$('#tabs [data-x]').forEach(b=>b.onclick=()=>{const id=+b.dataset.x;const i=tabs.findIndex(t=>t.id===id);tabs.splice(i,1);if(tabSel===id)tabSel=tabs[Math.max(0,i-1)].id;renderBrowser()});
  $('#newTab').onclick=()=>{tabs.push({id:++tabSeq,url:'ymail://start',title:'시작 페이지'});tabSel=tabSeq;renderBrowser()};
}
function renderPage(){
  const t=tabs.find(x=>x.id===tabSel);const el=$('#page');
  $('#addrIn').value=t.url==='ymail://start'?'':t.url;
  if(t.url==='ymail://start'){
    el.innerHTML=`<div class="page-in"><h2>어디로 갈까요?</h2><p style="color:var(--mute);margin:0">검색어나 주소를 위 주소창에 입력하세요.</p>
    <div class="tiles">${[['메일','mail'],['채팅','chat'],['국어사전','dictionary']].map(([n,v])=>`<button class="tile" data-go="${v}"><b>${n}</b></button>`).join('')}
    <button class="tile" data-open="https://www.wikipedia.org"><b>위키백과</b></button></div></div>`;
    $$('#page [data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
    $$('#page [data-open]').forEach(b=>b.onclick=()=>navigate(b.dataset.open));
  }else if(t.url.startsWith('search:')){
    const q=t.url.slice(7),r=t.results||{state:'loading'};
    let inner;
    if(r.state==='loading')inner='<p style="color:var(--mute)">검색하는 중…</p>';
    else if(r.state==='err')inner=`<div class="note">${esc(r.msg)}</div>`;
    else if(!r.items.length)inner='<p style="color:var(--mute)">검색 결과가 없어요. 다른 검색어로 시도해 보세요.</p>';
    else inner=r.items.map(x=>`<div class="res"><div class="u">${esc(x.host)}</div><a class="h" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||x.url)}</a><div>${esc(x.desc)}</div></div>`).join('');
    el.innerHTML=`<div class="page-in"><h2>“${esc(q)}” 검색 결과</h2>${inner}</div>`;
  }else{
    const href=/^https?:/i.test(t.url)?t.url:'https://'+t.url;
    el.innerHTML=`<div class="page-in"><h2>${esc(t.title)}</h2>
    <div class="note">이 프로토타입은 외부 사이트를 안에 띄울 수 없어요. 대부분의 사이트가 iframe 삽입을 막기 때문에, 실제 브라우저 기능은 서버 프록시나 별도 앱(Electron 등)이 필요해요.</div>
    <a class="btn primary" href="${esc(href)}" target="_blank" rel="noopener noreferrer">새 창에서 열기</a></div>`;
  }
}
function renderBrowser(){renderTabs();renderPage()}
function navigate(v){
  const t=tabs.find(x=>x.id===tabSel);v=v.trim();if(!v){t.url='ymail://start';t.title='시작 페이지'}
  else if(isUrl(v)){t.url=v.replace(/^https?:\/\//,'');t.title=t.url.split('/')[0]}
  else{t.url='search:'+v;t.title=v;t.results={state:'loading'};runSearch(t,v)}
  renderBrowser();
}
async function runSearch(t,q){
  try{const r=await api('/api/search?q='+encodeURIComponent(q));t.results={state:'ok',items:r.results}}
  catch(e){t.results={state:'err',msg:e.message}}
  if(t.url==='search:'+q)renderBrowser();
}
$('#addrForm').onsubmit=e=>{e.preventDefault();navigate($('#addrIn').value)};
$('#homeBtn').onclick=()=>navigate('');

/* ---------- theme ---------- */
$('#themeBtn').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};

/* ---------- auth ---------- */
async function api(path,opts={}){
  const init={credentials:'same-origin',method:opts.method||'GET',headers:{'Content-Type':'application/json'}};
  if(opts.body)init.body=JSON.stringify(opts.body);
  let r;try{r=await fetch(path,init)}catch(e){throw new Error('서버에 연결할 수 없어요. server.js가 실행 중인지 확인하세요.')}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||'요청에 실패했어요'),{status:r.status});
  return j;
}
var authMode='login';
function setAuthMode(m){
  authMode=m;const su=m==='signup';
  const login=document.getElementById('tabLogin'), signup=document.getElementById('tabSignup');
  const name=document.getElementById('fName'), pass2=document.getElementById('fPass2');
  const pass=document.getElementById('aPass'), submit=document.getElementById('authSubmit'), err=document.getElementById('authErr');
  if(login) login.setAttribute('aria-selected',String(!su));
  if(signup) signup.setAttribute('aria-selected',String(su));
  if(name) name.style.display=su?'':'none';
  if(pass2) pass2.style.display=su?'':'none';
  if(pass) pass.autocomplete=su?'new-password':'current-password';
  if(submit) submit.textContent=su?'계정 만들기':'로그인';
  if(err) err.textContent='';
}
$('#authForm').onsubmit=async e=>{
  e.preventDefault();const err=$('#authErr');err.textContent='';
  const username=$('#aUser').value.trim(),password=$('#aPass').value;
  if(!username||!password){err.textContent='아이디와 비밀번호를 입력하세요.';return}
  const body={username,password};
  if(authMode==='signup'){
    body.name=$('#aName').value.trim();
    if(!body.name){err.textContent='이름을 입력하세요.';return}
    if(password!==$('#aPass2').value){err.textContent='비밀번호 확인이 일치하지 않아요.';return}
  }
  const btn=$('#authSubmit');btn.disabled=true;
  try{const r=await api(authMode==='signup'?'/api/signup':'/api/login',{method:'POST',body});$('#aPass').value='';$('#aPass2').value='';await boot(r.user)}
  catch(x){err.textContent=x.message}
  finally{btn.disabled=false}
};
async function boot(user){
  USER=user;ME=user.email;
  folder='inbox';sel=null;query='';$('#q').value='';chatSel='';chatMessages=[];
  tabs=[{id:++tabSeq,url:'ymail://start',title:'시작 페이지'}];tabSel=tabSeq;
  $('#avatarBtn').textContent=user.name.trim().slice(0,1)||'나';
  $('#umName').textContent=user.name+(user.role==='admin'?' (관리자)':'');$('#umEmail').textContent=user.email;
  $('#umAdmin').style.display=user.role==='admin'?'':'none';
  // 메일/채팅 초기 로딩이 실패해도 인증 성공 직후 로그인 화면으로 되돌아가지 않게 합니다.
  $('#auth').classList.remove('on');$('#mailGrid').classList.remove('reading');
  renderMail();renderChat();renderBrowser();show('mail');
  const results = await Promise.allSettled([loadMails(), loadChatPeople()]);
  startChatPoll();
  renderMail();renderChat();
  if(results.some(result => result.status === 'rejected')) toast('로그인은 완료됐지만 일부 정보를 불러오지 못했어요. 새로고침해 보세요.');
}
async function logout(){
  try{await api('/api/logout',{method:'POST'})}catch(e){}
  USER=null;ME='';mails=[];people=[];chatMessages=[];chatSel='';clearInterval(chatPoll);$('#umenu').classList.remove('on');
  setAuthMode('login');$('#auth').classList.add('on');$('#aUser').focus();
}
$('#umLogout').onclick=logout;
$('#avatarBtn').onclick=e=>{e.stopPropagation();$('#umenu').classList.toggle('on')};
document.addEventListener('click',e=>{if(!e.target.closest('#umenu'))$('#umenu').classList.remove('on')});

/* admin */
async function openAdmin(){
  $('#umenu').classList.remove('on');$('#adminModal').classList.add('on');
  const body=$('#adminBody');body.textContent='불러오는 중…';
  try{
    const {users}=await api('/api/admin/users');
    body.innerHTML=`<table class="utable"><thead><tr><th>이메일</th><th>이름</th><th>가입일</th><th></th></tr></thead><tbody>`+
     users.map(u=>`<tr><td>${esc(u.email)} ${u.role==='admin'?'<span class="tag">관리자</span>':''}</td><td>${esc(u.name)}</td><td>${esc((u.createdAt||'').slice(0,10))}</td><td>${u.username===USER.username?'':`<button class="btn" data-del="${esc(u.username)}">삭제</button>`}</td></tr>`).join('')+`</tbody></table>`;
    $$('#adminBody [data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm(b.dataset.del+'@ymail.com 계정을 삭제할까요?'))return;
      try{await api('/api/admin/users/'+encodeURIComponent(b.dataset.del),{method:'DELETE'});toast('삭제했어요');openAdmin()}catch(x){toast(x.message)}
    });
  }catch(x){body.textContent=x.message}
}
$('#umAdmin').onclick=openAdmin;
$('#adminClose').onclick=()=>$('#adminModal').classList.remove('on');
$('#adminModal').onclick=e=>{if(e.target.id==='adminModal')$('#adminModal').classList.remove('on')};

/* ---------- init ---------- */
(async()=>{
  try{const r=await api('/api/me');await boot(r.user)}
  catch(e){
    $('#auth').classList.add('on');
    if(e.status!==401)$('#authErr').textContent=e.message;
  }
})();
</script>
